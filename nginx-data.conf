server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # tokens.json lives outside the web root, written by Hermes
    location /data/ {
        alias /data/;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store";
    }
}
