services:
  board:
    image: nginx:alpine
    container_name: board
    restart: unless-stopped
    ports:
      - "3100:80"
    volumes:
      - /home/sky/board:/usr/share/nginx/html:ro
      # tokens.json is written by Hermes inside its own container, mounted here read-only
      - /home/sky/.hermes/board-data:/data:ro
      - /home/sky/board/nginx-data.conf:/etc/nginx/conf.d/default.conf:ro
